<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPA 认证文件管理</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #242735;
        --border: #2e3145;
        --text: #e4e6ef;
        --text-dim: #8b8fa3;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --green: #22c55e;
        --green-bg: rgba(34, 197, 94, 0.12);
        --red: #ef4444;
        --red-bg: rgba(239, 68, 68, 0.12);
        --yellow: #eab308;
        --yellow-bg: rgba(234, 179, 8, 0.12);
        --blue: #3b82f6;
        --blue-bg: rgba(59, 130, 246, 0.12);
        --radius: 12px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* 头部 */
      .header {
        background: linear-gradient(
          135deg,
          #1e1b4b 0%,
          #312e81 50%,
          #1e1b4b 100%
        );
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #c7d2fe, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      /* 状态指示 */
      .connection-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
      }
      .connection-badge.ok {
        background: var(--green-bg);
        color: var(--green);
      }
      .connection-badge.err {
        background: var(--red-bg);
        color: var(--red);
      }
      .connection-badge.loading {
        background: var(--yellow-bg);
        color: var(--yellow);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.ok {
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }
      .dot.err {
        background: var(--red);
      }
      .dot.loading {
        background: var(--yellow);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* 主容器 */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      .main-layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 24px;
        align-items: start;
      }

      .content-area {
        min-width: 0;
      }

      .sidebar-area {
        position: sticky;
        top: 24px;
      }

      /* 配置栏 */
      .config-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        gap: 12px;
        align-items: end;
        flex-wrap: wrap;
      }
      .config-bar .field {
        flex: 1;
        min-width: 200px;
      }
      .config-bar label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .config-bar input,
      .config-bar select {
        width: 100%;
        padding: 8px 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }
      .config-bar input:focus {
        border-color: var(--accent);
      }
      .config-bar .field.small {
        flex: 0 0 80px;
        min-width: 80px;
      }
      .tooltip-wrap {
        position: relative;
        display: inline-block;
        margin-left: 4px;
        cursor: help;
      }
      .tooltip-wrap .tip-icon {
        font-size: 11px;
        opacity: 0.5;
        transition: opacity 0.2s;
      }
      .tooltip-wrap:hover .tip-icon {
        opacity: 1;
      }
      .tooltip-wrap .tip-text {
        display: none;
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 400;
        white-space: nowrap;
        z-index: 100;
        box-shadow: var(--shadow);
        text-transform: none;
        letter-spacing: 0;
      }
      .tooltip-wrap .tip-text::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: var(--border);
      }
      .tooltip-wrap:hover .tip-text {
        display: block;
      }

      /* 按钮 */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-outline {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
      }
      .btn-outline:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .btn-danger {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }
      .btn-success {
        background: var(--green-bg);
        color: var(--green);
        border: 1px solid rgba(34, 197, 94, 0.2);
      }
      .btn-success:hover {
        background: rgba(34, 197, 94, 0.2);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* 统计卡片 */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        text-align: center;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .stat-card .stat-value {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
      }
      .stat-card .stat-label {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stat-card.green .stat-value {
        color: var(--green);
      }
      .stat-card.red .stat-value {
        color: var(--red);
      }
      .stat-card.yellow .stat-value {
        color: var(--yellow);
      }
      .stat-card.blue .stat-value {
        color: var(--blue);
      }

      /* 操作栏 */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .toolbar h2 {
        font-size: 18px;
        font-weight: 600;
      }
      .toolbar-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .input-group {
        display: inline-flex;
        align-items: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding-right: 10px;
        transition: border-color 0.2s;
      }
      .input-group:focus-within {
        border-color: var(--accent);
      }
      .input-group input {
        background: transparent !important;
        border: none !important;
        padding: 7px 10px !important;
        width: 60px !important;
        text-align: center;
        color: var(--text);
        outline: none;
      }
      .input-group .suffix {
        font-size: 11px;
        color: var(--text-dim);
        user-select: none;
      }
      .search-box {
        padding: 8px 14px;
        background: var(--surface2);
        border: 2px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        width: 180px;
        transition: all 0.2s;
      }
      .search-box:focus {
        border-color: var(--accent);
        background: var(--surface);
        width: 240px;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }

      /* 分类筛选 */
      .filter-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .filter-tab {
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-dim);
        transition: all 0.2s;
        user-select: none;
      }
      .filter-tab:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .filter-tab.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .filter-tab .tab-count {
        display: inline-block;
        min-width: 18px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        font-size: 11px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.15);
        margin-left: 6px;
        padding: 0 5px;
      }
      .filter-tab.active .tab-count {
        background: rgba(255, 255, 255, 0.25);
      }

      /* 账号列表 */
      .account-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        transition: all 0.3s ease;
      }
      /* 网格模式 */
      .account-list.grid-mode {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
      }
      .account-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .account-card:hover {
        border-color: var(--accent);
        background: var(--surface2);
      }
      .account-icon {
        font-size: 22px;
        flex-shrink: 0;
      }
      .account-info {
        flex: 1;
        min-width: 0;
      }
      .account-email {
        font-weight: 500;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .account-meta {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 2px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .account-error {
        font-size: 12px;
        color: var(--red);
        margin-top: 4px;
        padding: 6px 10px;
        background: var(--red-bg);
        border-radius: 6px;
        word-break: break-all;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .status-badge.active {
        background: var(--green-bg);
        color: var(--green);
      }
      .status-badge.error {
        background: var(--red-bg);
        color: var(--red);
      }
      .status-badge.disabled {
        background: var(--yellow-bg);
        color: var(--yellow);
      }
      .account-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      /* 网格模式下的卡片微调 */
      .grid-mode .account-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px 20px;
        position: relative;
      }
      .grid-mode .account-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .grid-mode .account-info {
        width: 100%;
      }
      .grid-mode .account-meta {
        justify-content: center;
        gap: 8px;
      }
      .grid-mode .status-badge {
        position: absolute;
        top: 12px;
        right: 12px;
      }
      .grid-mode .account-actions {
        width: 100%;
        justify-content: center;
        border-top: 1px solid var(--border);
        padding-top: 16px;
        margin-top: 8px;
      }

      /* 批量操作栏 */
      .batch-bar {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.15),
          rgba(99, 102, 241, 0.05)
        );
        border: 1px solid rgba(99, 102, 241, 0.3);
        border-radius: var(--radius);
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .batch-bar.show {
        display: flex;
      }
      .batch-bar .batch-count {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-hover);
        min-width: 100px;
      }
      .batch-bar .btn {
        font-size: 12px;
        padding: 6px 14px;
      }
      /* 卡片复选框 */
      .account-card .batch-check {
        flex-shrink: 0;
      }
      .account-card.selected {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.08);
      }

      /* 日志 */
      .log-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        height: calc(100vh - 200px);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .log-header {
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .log-header .close-drawer {
        display: none;
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 20px;
        cursor: pointer;
      }
      .log-header h3 {
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .log-header .left-side {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .log-body {
        padding: 14px 18px;
        flex: 1;
        overflow-y: auto;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-dim);
        background: #00000022;
      }
      .log-body .log-line {
        white-space: pre-wrap;
        word-break: break-all;
        margin-bottom: 4px;
      }
      .log-body .log-line.info {
        color: var(--text);
      }
      .log-body .log-line.success {
        color: var(--green);
      }
      .log-body .log-line.error {
        color: var(--red);
      }
      .log-body .log-line.warn {
        color: var(--yellow);
      }

      /* 悬浮按钮 */
      .fab {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 50px;
        height: 50px;
        border-radius: 25px;
        background: var(--accent);
        color: white;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        border: none;
        cursor: pointer;
        z-index: 1000;
        transition: transform 0.2s;
      }
      .fab:active {
        transform: scale(0.9);
      }

      /* 抽屉背景遮罩 */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        z-index: 1001;
        display: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .drawer-overlay.show {
        display: block;
        opacity: 1;
      }

      /* 加载遮罩 */
      .loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 17, 23, 0.7);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .loading-overlay.show {
        opacity: 1;
        pointer-events: all;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 空状态 */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-dim);
      }
      .empty-state .emoji {
        font-size: 48px;
        margin-bottom: 12px;
      }

      /* 登录框 */
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        box-shadow: var(--shadow);
      }
      .login-card .icon-box {
        font-size: 48px;
        margin-bottom: 16px;
      }
      .login-card h2 {
        margin: 0 0 8px;
        font-size: 20px;
        color: var(--text);
      }
      .login-card p {
        font-size: 13px;
        color: var(--text-dim);
        margin: 0 0 20px;
      }
      .login-card input[type="text"],
      .login-card input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
      }

      /* 响应式 */
      @media (max-width: 1024px) {
        .main-layout {
          grid-template-columns: 1fr;
        }
        .log-panel {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 60vh;
          z-index: 1002;
          border-radius: 20px 20px 0 0;
          transform: translateY(100%);
          margin: 0;
        }
        .log-panel.drawer-open {
          transform: translateY(0);
        }
        .log-header .close-drawer {
          display: block;
        }
        .sidebar-area {
          position: static;
          display: none; /* 平时隐藏，仅作为抽屉弹出 */
        }
        .sidebar-area.drawer-active {
          display: block;
        }
        .fab {
          display: flex;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 16px 20px;
          justify-content: center;
          text-align: center;
        }
        .header h1 {
          font-size: 18px;
        }
        .container {
          padding: 16px;
        }
        .config-bar {
          background: var(--surface2);
          padding: 16px;
        }
        .config-bar .field {
          flex: 1 1 100%;
          min-width: 0;
        }
        .toolbar-actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
          width: 100%;
          margin-top: 12px;
        }
        .toolbar-actions #searchInput {
          grid-column: 1 / -1;
          width: 100% !important;
          max-width: none !important;
        }
        .config-bar .field.small {
          flex: 1 1 calc(50% - 6px);
        }
        .config-bar button {
          width: 100%;
          justify-content: center;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .account-card {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
          padding: 16px;
        }
        .account-info {
          width: 100%;
        }
        .account-actions {
          width: 100%;
          justify-content: flex-end;
          border-top: 1px solid var(--border);
          padding-top: 12px;
          margin-top: 4px;
        }
        .status-badge {
          position: absolute;
          top: 16px;
          right: 16px;
        }
        .account-card {
          position: relative;
          margin-bottom: 16px !important;
        }
        .login-card {
          padding: 30px 20px;
          border-radius: 0;
          border: none;
          max-width: none;
        }
      }

      @media (max-width: 480px) {
        .config-bar .field.small {
          flex: 1 1 45%;
          min-width: 0;
        }
        .stats {
          grid-template-columns: 1fr 1fr; /* 强制 2 列 */
          gap: 12px;
        }
        .account-list {
          gap: 20px !important;
          display: flex !important;
          flex-direction: column !important;
        }
        .account-list.grid-mode {
          display: grid !important;
          gap: 20px !important;
        }
        .stat-card {
          padding: 12px 8px;
        }
        .stat-card .stat-value {
          font-size: 20px;
        }
        .header {
          flex-direction: column;
          padding: 16px 12px;
        }

  <body>

    <div class="container">

    <script>
      // ============================================================
      // 常量定义（集中管理，避免魔法值散落）
      // ============================================================

      // -- 存储键名 --
      const STORAGE_KEY_CREDENTIALS = "cpa_credentials";
      const STORAGE_KEY_LOGGED_IN = "cpa_logged_in";
      const STORAGE_KEY_SESSION = "cpa_key";
      const STORAGE_KEY_LAYOUT = "cpa_layout";

      // -- API 端点 --
      const ENDPOINT_API = "/api";
      const ENDPOINT_AUTH_VERIFY = "/auth/verify";
      const ENDPOINT_LOCAL_CONFIG = "/local/config";
      const ENDPOINT_LOCAL_PRIORITY = "/local/priority";
      const ENDPOINT_LOCAL_LOGS = "/local/logs";
      const ENDPOINT_PATROL_START = "/local/patrol/start";
      const ENDPOINT_PATROL_STOP = "/local/patrol/stop";
      const ENDPOINT_PATROL_STATUS = "/local/patrol/status";
      const ENDPOINT_PATROL_RUN = "/local/patrol/run";

      // -- 默认配置值 --
      const DEFAULT_TARGET = 5; // 目标启用账号数
      const DEFAULT_TIMEOUT = 30; // API 请求超时（秒）
      const DEFAULT_PATROL_INTERVAL = 180; // 巡检间隔（秒）
      const MIN_PATROL_INTERVAL = 30; // 巡检最小间隔（秒）
      const LOG_POLL_INTERVAL_MS = 5000; // 日志轮询间隔（毫秒）

      // -- 错误判定 --
      const TOS_VIOLATION_CODE = 403; // TOS 违规 HTTP 状态码
      const TOS_VIOLATION_REASON = "TOS_VIOLATION"; // TOS 违规原因标识

      // -- 优先级标签 --
      const PRIORITY_NORMAL = "normal"; // 普通（默认）
      const PRIORITY_PREFER = "prefer"; // 优先启用
      const PRIORITY_BLOCK = "block"; // 永不启用

      // -- 账号状态值（后端 API 返回的 f.status）--
      const STATUS_DISABLED = "disabled"; // 已禁用
      const STATUS_ERROR = "error"; // 错误
      const STATUS_ACTIVE = "active"; // 正常

      // -- 筛选器键名 --
      const FILTER_ALL = "all"; // 全部
      const FILTER_ENABLED = "enabled"; // 启用中
      const FILTER_HEALTHY = "healthy"; // 正常运行
      const FILTER_ERROR = "error"; // 错误状态
      const FILTER_DISABLED = "disabled"; // 已禁用
      const FILTER_CLEAN = "clean"; // 候补池（干净的禁用账号）
      const FILTER_VALIDATION = "validation"; // 需要验证
      const FILTER_TOS = "tosViolation"; // TOS 违规

      // ============================================================
      // 密钥显示/隐藏切换
      // ============================================================

      function toggleKeyVisibility() {
        const input = document.getElementById("loginKey");
        const btn = document.getElementById("btnToggleKey");
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "🔒";
          btn.title = "隐藏密钥";
        } else {
          input.type = "password";
          btn.textContent = "👁";
          btn.title = "显示密钥";
        }
      }

      // ============================================================
      // 加密工具（XOR + Base64，与 Cli-Proxy-API-Management-Center 同源）
      // ============================================================

      const ENC_PREFIX = "enc::v1::";
      const SECRET_SALT = "cpa-management::secure-storage";
      let _cachedKeyBytes = null;

      function _encodeText(text) {
        return new TextEncoder().encode(text);
      }
      function _decodeText(bytes) {
        return new TextDecoder().decode(bytes);
      }
      function _getKeyBytes() {
        if (_cachedKeyBytes) return _cachedKeyBytes;
        try {
          _cachedKeyBytes = _encodeText(
            `${SECRET_SALT}|${location.host}|${navigator.userAgent}`,
          );
        } catch {
          _cachedKeyBytes = _encodeText(SECRET_SALT);
        }
        return _cachedKeyBytes;
      }
      function _xor(data, key) {
        const out = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++)
          out[i] = data[i] ^ key[i % key.length];
        return out;
      }
      function _toBase64(bytes) {
        let bin = "";
        for (let i = 0; i < bytes.length; i++)
          bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function _fromBase64(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      function encryptValue(value) {
        if (!value) return value;
        try {
          return (
            ENC_PREFIX + _toBase64(_xor(_encodeText(value), _getKeyBytes()))
          );
        } catch {
          return value;
        }
      }
      function decryptValue(payload) {
        if (!payload || !payload.startsWith(ENC_PREFIX)) return payload;
        try {
          return _decodeText(
            _xor(_fromBase64(payload.slice(ENC_PREFIX.length)), _getKeyBytes()),
          );
        } catch {
          return payload;
        }
      }

      // ============================================================
      // 凭据持久化（localStorage 加密存储）
      // ============================================================

      function saveCredentials(base, key) {
        const data = JSON.stringify({ base, key });
        localStorage.setItem(STORAGE_KEY_CREDENTIALS, encryptValue(data));
        localStorage.setItem(STORAGE_KEY_LOGGED_IN, "true");
      }

      function loadCredentials() {
        const raw = localStorage.getItem(STORAGE_KEY_CREDENTIALS);
        if (!raw) return null;
        try {
          return JSON.parse(decryptValue(raw));
        } catch {
          return null;
        }
      }

      function clearCredentials() {
        localStorage.removeItem(STORAGE_KEY_CREDENTIALS);
        localStorage.removeItem(STORAGE_KEY_LOGGED_IN);
      }

      // ============================================================
      // 鉴权
      // ============================================================

      function getToken() {
        return sessionStorage.getItem(STORAGE_KEY_SESSION) || "";
      }

      function authHeaders() {
        return {
          "Content-Type": "application/json",
          Authorization: `Bearer ${getToken()}`,
        };
      }

      async function doLogin() {
        const errorEl = document.getElementById("loginError");
        const base = document
          .getElementById("loginBase")
          .value.trim()
          .replace(/\/+$/, "");
        const key = document.getElementById("loginKey").value.trim();
        const remember = document.getElementById("loginRemember").checked;
        if (!base || !key) {
          errorEl.textContent = "请填写所有字段";
          return;
        }

        try {
          const resp = await fetch(ENDPOINT_AUTH_VERIFY, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ base, key }),
          });
          if (resp.ok) {
            sessionStorage.setItem(STORAGE_KEY_SESSION, key);
            // 记住密码：加密存入 localStorage
            if (remember) {
              saveCredentials(base, key);
            } else {
              clearCredentials();
            }
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("btnLogout").style.display = "";
            initApp();
          } else {
            const data = await resp.json().catch(() => ({}));
            errorEl.textContent = data.error || "地址或密钥无效";
          }
        } catch {
          errorEl.textContent = "连接失败";
        }
      }

      // 自动恢复会话（从 localStorage 读取加密凭据并验证）
      async function restoreSession() {
        if (localStorage.getItem(STORAGE_KEY_LOGGED_IN) !== "true")
          return false;
        const cred = loadCredentials();
        if (!cred || !cred.base || !cred.key) return false;
        try {
          const resp = await fetch(ENDPOINT_AUTH_VERIFY, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ base: cred.base, key: cred.key }),
          });
          if (resp.ok) {
            sessionStorage.setItem(STORAGE_KEY_SESSION, cred.key);
            return true;
          }
        } catch {}
        return false;
      }

      function logout() {
        stopCountdown();
        stopLogPoll();
        sessionStorage.removeItem(STORAGE_KEY_SESSION);
        clearCredentials();
        location.reload();
      }

      async function checkAuth() {
        const key = getToken();
        if (!key) return false;
        try {
          const resp = await fetch("/api/config", { headers: authHeaders() });
          return resp.ok;
        } catch {
          return false;
        }
      }

      // ============================================================
      // API 通信
      // ============================================================

      const API_PREFIX = ENDPOINT_API;

      function getConfig() {
        return {
          target:
            parseInt(document.getElementById("cfgTarget").value) ||
            DEFAULT_TARGET,
          timeout:
            parseInt(document.getElementById("cfgTimeout").value) ||
            DEFAULT_TIMEOUT,
          patrolInterval:
            parseInt(document.getElementById("patrolInterval").value) ||
            DEFAULT_PATROL_INTERVAL,
        };
      }

      function saveConfig() {
        const cfg = {
          ...getConfig(),
        };
        // fire-and-forget 写入后端
        fetch(ENDPOINT_LOCAL_CONFIG, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify(cfg),
        }).catch(() => {});
      }

      function confirmSaveConfig(inputEl) {
        if (confirm("确认修改配置？")) {
          saveConfig();
        } else {
          // 回滚到修改前的值
          if (inputEl && inputEl.dataset.prev !== undefined) {
            inputEl.value = inputEl.dataset.prev;
          }
        }
      }

      async function loadConfig() {
        try {
          const resp = await fetch(ENDPOINT_LOCAL_CONFIG, {
            headers: authHeaders(),
          });
          if (resp.ok) {
            const cfg = await resp.json();
            if (cfg.target)
              document.getElementById("cfgTarget").value = cfg.target;
            if (cfg.timeout)
              document.getElementById("cfgTimeout").value = cfg.timeout;
            if (cfg.patrolInterval)
              document.getElementById("patrolInterval").value =
                cfg.patrolInterval;
            return cfg;
          }
        } catch {}
        return null;
      }

      async function apiRequest(method, endpoint, body) {
        const { timeout } = getConfig();
        const url = API_PREFIX + endpoint;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout * 1000);

        const opts = {
          method,
          headers: authHeaders(),
          signal: controller.signal,
        };

        if (body !== undefined) opts.body = JSON.stringify(body);

        try {
          const resp = await fetch(url, opts);
          clearTimeout(timeoutId);

          if (!resp.ok) {
            let errBody;
            try {
              errBody = await resp.json();
            } catch {}
            // 鉴权失败，自动退出登录
            if (resp.status === 401 && !window._loggingOut) {
              window._loggingOut = true;
              alert(errBody?.error || "登录已失效，请重新登录");
              logout();
              return;
            }
            throw Object.assign(
              new Error(
                errBody?.message || errBody?.error || `HTTP ${resp.status}`,
              ),
              { status: resp.status, data: errBody },
            );
          }
          const text = await resp.text();
          return text ? JSON.parse(text) : null;
        } catch (err) {
          if (err.name === "AbortError") {
            throw new Error(`请求超时 (${timeout}s)`);
          }
          throw err;
        }
      }

      // ============================================================
      // 错误解析（与 CLI 一致）
      // ============================================================

      function parseStatusError(msg) {
        if (!msg) return null;
        try {
          const obj = JSON.parse(msg);
          const err = obj?.error;
          if (!err) return null;
          const reasons = [];
          let validationUrl = "";
          if (Array.isArray(err.details)) {
            for (const d of err.details) {
              if (d.reason) reasons.push(d.reason);
              if (d.metadata?.validation_url)
                validationUrl = d.metadata.validation_url;
            }
          }
          return {
            code: err.code || 0,
            message: err.message || "",
            status: err.status || "",
            reasons,
            validationUrl,
          };
        } catch {
          return null;
        }
      }

      function shouldDisable(file, parsed) {
        if (!parsed) return false;
        return (
          parsed.code === TOS_VIOLATION_CODE &&
          parsed.reasons.includes(TOS_VIOLATION_REASON)
        );
      }

      function isCleanDisabled(file) {
        if (!file.disabled && file.status !== STATUS_DISABLED) return false;
        const parsed = parseStatusError(file.status_message);
        if (shouldDisable(file, parsed)) return false;
        return true;
      }

      function hasValidationUrl(file) {
        const parsed = parseStatusError(file.status_message);
        return parsed && parsed.validationUrl;
      }

      function aggregateUsageByAccount(usageData) {
        const map = new Map();
        const apis = usageData?.usage?.apis;
        if (!apis) return map;
        for (const apiData of Object.values(apis)) {
          const models = apiData.models;
          if (!models) continue;
          for (const modelData of Object.values(models)) {
            if (!Array.isArray(modelData.details)) continue;
            for (const record of modelData.details) {
              const email = record.source;
              if (!email) continue;
              let entry = map.get(email);
              if (!entry) {
                entry = { success: 0, failed: 0, tokens: 0 };
                map.set(email, entry);
              }
              if (record.failed) entry.failed++;
              else entry.success++;
              entry.tokens += record.tokens?.total_tokens || 0;
            }
          }
        }
        return map;
      }

      function sortCleanPool(pool, usageMap = new Map()) {
        const prioMap = getAccountPriority();
        // 过滤掉 block 账号
        const filtered = pool.filter(
          (f) => prioMap[f.account] !== PRIORITY_BLOCK,
        );
        return filtered.sort((a, b) => {
          const aPrio = prioMap[a.account] === PRIORITY_PREFER ? 1 : 0;
          const bPrio = prioMap[b.account] === PRIORITY_PREFER ? 1 : 0;
          if (bPrio !== aPrio) return bPrio - aPrio;
          const aUsage = usageMap.get(a.account) || { success: 0 };
          const bUsage = usageMap.get(b.account) || { success: 0 };
          if (bUsage.success !== aUsage.success)
            return bUsage.success - aUsage.success;
          const aTime = a.last_refresh ? new Date(a.last_refresh).getTime() : 0;
          const bTime = b.last_refresh ? new Date(b.last_refresh).getTime() : 0;
          return bTime - aTime;
        });
      }

      // ============================================================
      // 账号优先级管理
      // ============================================================

      // 优先级内存缓存（从后端加载）
      let _priorityCache = {};

      function getAccountPriority() {
        return _priorityCache;
      }

      async function loadPriorityFromServer() {
        try {
          const data = await fetch(ENDPOINT_LOCAL_PRIORITY, {
            headers: authHeaders(),
          }).then((r) => r.json());
          _priorityCache = data || {};
        } catch {
          _priorityCache = {};
        }
      }

      function setAccountPriority(account, tag) {
        if (!tag || tag === PRIORITY_NORMAL) {
          delete _priorityCache[account];
        } else {
          _priorityCache[account] = tag;
        }
        // 异步保存到后端
        fetch(ENDPOINT_LOCAL_PRIORITY, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify(_priorityCache),
        }).catch(() => {});
      }

      function cycleAccountPriority(account) {
        const current = _priorityCache[account] || PRIORITY_NORMAL;
        const next =
          current === PRIORITY_NORMAL
            ? PRIORITY_PREFER
            : current === PRIORITY_PREFER
              ? PRIORITY_BLOCK
              : PRIORITY_NORMAL;
        setAccountPriority(account, next);
        renderAccounts(allFiles);
        renderFilterTabs(allFiles);
        renderStats(allFiles);
      }

      function getPriorityBadge(account) {
        const map = getAccountPriority();
        const tag = map[account];
        if (tag === PRIORITY_PREFER)
          return '<span style="color:#fbbf24;font-size:11px;margin-left:6px;" title="优先启用">⭐优先</span>';
        if (tag === PRIORITY_BLOCK)
          return '<span style="color:#ef4444;font-size:11px;margin-left:6px;" title="永不启用">🚫禁止</span>';
        return "";
      }

      // ============================================================
      // 工具函数
      // ============================================================

      // 防 XSS：转义 HTML 特殊字符
      function escapeHtml(str) {
        if (!str) return "";
        const el = document.createElement("div");
        el.textContent = str;
        return el.innerHTML;
      }

      // ============================================================
      // 状态管理
      // ============================================================

      let allFiles = [];
      let currentFilter = FILTER_ALL;
      let searchKeyword = "";
      let usageMap = new Map();
      let _countdownTimer = null;
      let _localCountdown = 0;
      let _lastKnownRunAt = 0;
      let _runningPollTimer = null;
      let _logPollTimer = null;

      function startLogPoll() {
        stopLogPoll();
        _logPollTimer = setInterval(restoreLogs, LOG_POLL_INTERVAL_MS);
      }

      function stopLogPoll() {
        if (_logPollTimer) {
          clearInterval(_logPollTimer);

      // ============================================================
      // 巡检控制（事件驱动同步 + 本地倒计时）
      // ============================================================

      async function fetchPatrolStatus() {
        try {
          const resp = await fetch(ENDPOINT_PATROL_STATUS, {
            headers: authHeaders(),
          });
          if (resp.ok) return await resp.json();
        } catch {}
        return null;
      }

      // 从后端拉取状态并同步 UI + 本地倒计时
      async function syncPatrolStatus() {
        const status = await fetchPatrolStatus();
        applyPatrolStatus(status);
        return status;
      }

      function stopRunningPoll() {
        if (_runningPollTimer) {
          clearTimeout(_runningPollTimer);
          _runningPollTimer = null;
        }
      }

      function applyPatrolStatus(status) {
        const btn = document.getElementById("btnPatrol");
        const statusEl = document.getElementById("patrolStatus");
        if (!btn || !statusEl) return;

        // 每次同步都清掉短轮询，按新状态决定是否重启
        stopRunningPoll();

        // 检测到新的巡检执行，自动刷新日志和数据
        if (
          status &&
          status.lastRunAt > _lastKnownRunAt &&
          _lastKnownRunAt > 0
        ) {
          restoreLogs();
          refreshData();
        }
        _lastKnownRunAt = status?.lastRunAt || 0;

        if (!status || !status.active) {
          btn.textContent = "🔄 定时巡检";
          btn.classList.remove("btn-primary");
          btn.classList.add("btn-outline");
          statusEl.textContent = "";
          stopCountdown();
          return;
        }

        btn.textContent = "⏹️ 停止巡检";
        btn.classList.remove("btn-outline");
        btn.classList.add("btn-primary");

        if (status.running) {
          statusEl.textContent = "执行中...";
          stopCountdown();
          // 后端正在执行，2 秒后再次轮询等待完成
          _runningPollTimer = setTimeout(() => syncPatrolStatus(), 2000);
        } else {
          // 用后端精确值初始化本地倒计时
          _localCountdown = status.remaining || 0;
          renderCountdown();
          startCountdown();
        }
      }

      function startCountdown() {
        stopCountdown();
        _countdownTimer = setInterval(() => {
          _localCountdown--;
          if (_localCountdown <= 0) {
            // 倒计时到 0，同步后端获取最新状态
            syncPatrolStatus();
            return;
          }
          renderCountdown();
        }, 1000);
      }

      function stopCountdown() {
        if (_countdownTimer) {
          clearInterval(_countdownTimer);
          _countdownTimer = null;
        }
        stopRunningPoll();
      }

      function renderCountdown() {
        const el = document.getElementById("patrolStatus");
        if (!el) return;
        const min = Math.floor(_localCountdown / 60);
        const sec = _localCountdown % 60;
        el.textContent = `下次: ${min}:${String(sec).padStart(2, "0")}`;
      }

      async function togglePatrol() {
        const status = await fetchPatrolStatus();
        if (status?.active) {
          if (!confirm("确认停止巡检？")) return;
          await fetch(ENDPOINT_PATROL_STOP, {
            method: "POST",
            headers: authHeaders(),
          });
        } else {
          if (!confirm("确认开启定时巡检？")) return;
          const raw =
            parseInt(document.getElementById("patrolInterval").value) ||
            DEFAULT_PATROL_INTERVAL;
          const interval = Math.max(raw, MIN_PATROL_INTERVAL);
          await fetch(ENDPOINT_PATROL_START, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ interval }),
          });
        }
        await syncPatrolStatus();
        await restoreLogs();
      }

      // ============================================================

      function log(msg, type = "info") {
        const body = document.getElementById("logBody");
        const line = document.createElement("div");
        line.className = `log-line ${type}`;
        const ts = new Date().toLocaleTimeString();
        line.textContent = `[${ts}] ${msg}`;
        body.appendChild(line);
        while (body.children.length > 500) {
          body.removeChild(body.firstChild);
        }
        body.scrollTop = body.scrollHeight;
      }
      function clearLog() {
        document.getElementById("logBody").innerHTML = "";
        fetch(ENDPOINT_LOCAL_LOGS, {
          method: "DELETE",
          headers: authHeaders(),
        }).catch(() => {});
      }
      async function restoreLogs() {
        try {
          const data = await fetch(ENDPOINT_LOCAL_LOGS, {
            headers: authHeaders(),
          }).then((r) => r.json());
          if (!Array.isArray(data) || data.length === 0) return;
          const body = document.getElementById("logBody");
          body.innerHTML = "";
          for (const item of data) {
            const line = document.createElement("div");
            line.className = item.cls || "log-line info";
            line.textContent = item.text;
            body.appendChild(line);
          }
        } catch {}
      }

      // ============================================================

      let batchMode = false;

      function enterBatchMode() {
        batchMode = true;
        document.getElementById("batchBar").classList.add("show");
        updateBatchUI();
      }

      function exitBatchMode() {
        batchMode = false;
        selectedSet.clear();

      }

      function toggleSelect(index) {
        if (selectedSet.has(index)) {
          selectedSet.delete(index);
        } else {
          selectedSet.add(index);
        }
        // 自动显示/隐藏批量操作栏
        if (selectedSet.size > 0) {
          batchMode = true;
          document.getElementById("batchBar").classList.add("show");
        } else {
          batchMode = false;
          document.getElementById("batchBar").classList.remove("show");
        }
        updateBatchUI();
        renderAccounts(allFiles);
      }

      function batchSelectAll() {
        let filtered = getFilteredFiles(allFiles, currentFilter);
        if (searchKeyword) {
          filtered = filtered.filter((f) =>
            (f.account || f.email || f.name || "")
              .toLowerCase()
              .includes(searchKeyword),
          );
        }
        for (const f of filtered) {
          selectedSet.add(allFiles.indexOf(f));
        }
        updateBatchUI();
        renderAccounts(allFiles);
      }

      function batchDeselectAll() {
        selectedSet.clear();
        updateBatchUI();
        renderAccounts(allFiles);
      }

      function updateBatchUI() {
        document.getElementById("batchCount").textContent =
          `已选 ${selectedSet.size} 个`;
      }

      async function batchToggle(disabled) {
        if (selectedSet.size === 0) {
          alert("请先选择要操作的账号");
          return;
        }
        const action = disabled ? "禁用" : "启用";
        if (!confirm(`确认批量${action} ${selectedSet.size} 个账号?`)) return;

        showLoading(true);
        log(`⏳ 开始批量${action} ${selectedSet.size} 个账号...`, "info");

        const targets = [...selectedSet]
          .map((idx) => allFiles[idx])
          .filter(Boolean);
        const results = await Promise.allSettled(
          targets.map((f) => {
            const name = f.name || f.account || f.email;
            return apiRequest("PATCH", "/auth-files/status", {
              name,
              disabled,
            }).then(() => name);
          }),
        );

        let success = 0,
          fail = 0;
        for (const r of results) {
          if (r.status === "fulfilled") {
            success++;
            log(`  ✓ ${r.value} 已${action}`, "success");
          } else {
            fail++;
            log(`  ✗ ${action}失败: ${r.reason?.message || r.reason}`, "error");
          }
        }

        log(
          `批量${action}完成: ${success} 成功, ${fail} 失败`,
          success > 0 ? "success" : "error",
        );
        exitBatchMode();
        await refresh();
      }

      async function deleteAccount(index) {
        const f = allFiles[index];
        if (!f) return;
        const name = f.name || f.account || f.email;
        const displayName = f.account || f.email || f.name;
        if (
          !confirm(
            `确认删除凭证「${displayName}」?\n\n⚠️ 此操作不可恢复，凭证文件将被永久删除。`,
          )
        )
          return;

        showLoading(true);
        try {
          await apiRequest(
            "DELETE",
            `/auth-files?name=${encodeURIComponent(name)}`,

          await refresh();

          alert("请先选择要删除的账号");

            `⚠️ 确认删除 ${selectedSet.size} 个凭证?\n\n此操作不可恢复，凭证文件将被永久删除！`,

        )

      // ============================================================
      // 数据处理与渲染
      // ============================================================

      // 统一分类函数，消除重复过滤逻辑
      function classifyFiles(files) {
        const enabled = files.filter(
          (f) => !f.disabled && f.status !== STATUS_DISABLED,
        );
        const disabled = files.filter(
          (f) => f.disabled || f.status === STATUS_DISABLED,
        );
        const healthy = enabled.filter((f) => f.status !== STATUS_ERROR);
        const errors = enabled.filter((f) => f.status === STATUS_ERROR);
        const clean = files.filter(isCleanDisabled);
        const validation = files.filter(hasValidationUrl);
        const tosViolation = files.filter((f) => {
          const parsed = parseStatusError(f.status_message);
          return shouldDisable(f, parsed);
        });
        return {
          enabled,
          disabled,
          healthy,
          errors,
          clean,
          validation,
          tosViolation,
        };
      }

      function renderStats(files) {
        const { enabled, healthy, errors, disabled, clean } =
          classifyFiles(files);
        const target =
          parseInt(document.getElementById("cfgTarget").value) || 5;

        document.getElementById("statsArea").innerHTML = `
    <div class="stat-card"><div class="stat-value">${files.length}</div><div class="stat-label">总计</div></div>
    <div class="stat-card green"><div class="stat-value">${enabled.length}</div><div class="stat-label">启用</div></div>
    <div class="stat-card blue"><div class="stat-value">${healthy.length}</div><div class="stat-label">正常</div></div>
    <div class="stat-card red"><div class="stat-value">${errors.length}</div><div class="stat-label">错误</div></div>
    <div class="stat-card yellow"><div class="stat-value">${disabled.length}</div><div class="stat-label">禁用</div></div>
    <div class="stat-card"><div class="stat-value">${clean.length}</div><div class="stat-label">候补池</div></div>
    <div class="stat-card ${enabled.length === target ? "green" : "red"}">
      <div class="stat-value">${target}</div><div class="stat-label">目标</div>
    </div>
  `;
      }

      function getFilteredFiles(files, filter) {
        if (filter === FILTER_ALL) return files;
        const groups = classifyFiles(files);
        return groups[filter] || files;
      }

      function renderFilterTabs(files) {
        const {
          enabled,
          healthy,
          errors,
          disabled,
          clean,
          validation,
          tosViolation,
        } = classifyFiles(files);

        const tabs = [
          { key: FILTER_ALL, label: "全部", count: files.length },
          { key: FILTER_ENABLED, label: "🟢 启用", count: enabled.length },
          { key: FILTER_HEALTHY, label: "✅ 正常", count: healthy.length },
          { key: FILTER_ERROR, label: "❌ 错误", count: errors.length },
          { key: FILTER_DISABLED, label: "⏸️ 禁用", count: disabled.length },
          { key: FILTER_CLEAN, label: "💤 候补", count: clean.length },
          {
            key: FILTER_VALIDATION,
            label: "🔗 需验证",
            count: validation.length,
          },
          {
            key: FILTER_TOS,
            label: "🚫 TOS违规",
            count: tosViolation.length,
          },
        ];

        document.getElementById("filterTabs").innerHTML = tabs
          .map(
            (t) =>
              `<button class="filter-tab ${currentFilter === t.key ? "active" : ""}" onclick="setFilter('${t.key}')">${t.label}<span class="tab-count">${t.count}</span></button>`,
          )
          .join("");
      }

      function setFilter(filter) {
        currentFilter = filter;
        renderFilterTabs(allFiles);
        renderAccounts(allFiles);
      }

      function renderAccounts(files) {
        const list = document.getElementById("accountList");
        let filtered = getFilteredFiles(files, currentFilter);

        // 搜索过滤
        if (searchKeyword) {
          filtered = filtered.filter((f) =>
            (f.account || f.email || f.name || "")
              .toLowerCase()
              .includes(searchKeyword),
          );
        }

        if (filtered.length === 0) {
          const msg = searchKeyword
            ? `没有匹配「${escapeHtml(searchKeyword)}」的账号`
            : "该分类下没有账号";
          list.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><p>${msg}</p></div>`;
          return;
        }

        // 预构建索引映射，避免 O(n²) 的 indexOf
        const indexMap = new Map(files.map((f, i) => [f, i]));

        list.innerHTML = filtered
          .map((f) => {
            const i = indexMap.get(f);
            const parsed = parseStatusError(f.status_message);
            const isEnabled = !f.disabled && f.status !== STATUS_DISABLED;
            const isError = f.status === STATUS_ERROR;
            const isDisabled = f.disabled || f.status === STATUS_DISABLED;
            const clean = isCleanDisabled(f);

            const icon = shouldDisable(f, parsed)
              ? "🚫"
              : clean
                ? "💤"
                : isDisabled
                  ? "⏸️"
                  : isError
                    ? "❌"
                    : "✅";

            const badgeClass = isDisabled
              ? STATUS_DISABLED
              : isError
                ? STATUS_ERROR
                : STATUS_ACTIVE;
            const badgeText = isDisabled
              ? "DISABLED"
              : (f.status || "").toUpperCase();

            const displayName = escapeHtml(
              f.account || f.email || f.name || "",
            );
            const displayProvider = escapeHtml(f.provider || "-");
            const displayType = escapeHtml(f.type || "-");

            let errorHtml = "";
            if (isError && parsed) {
              const reasons = parsed.reasons.length
                ? ` (${escapeHtml(parsed.reasons.join(", "))})`
                : "";
              errorHtml = `<div class="account-error">${parsed.code}: ${escapeHtml(parsed.message.trim().slice(0, 120))}${reasons}</div>`;
              if (parsed.validationUrl) {
                errorHtml += `<div style="margin-top:4px;"><a href="${escapeHtml(parsed.validationUrl)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:12px;text-decoration:underline;">🔗 点击验证账号</a></div>`;
              }
            }

            const tags = [];
            if (shouldDisable(f, parsed)) tags.push("待禁用");
            if (clean) tags.push("候补");
            const tagStr = tags
              .map(
                (t) =>
                  `<span style="color:var(--accent);margin-left:6px;font-size:11px;">#${t}</span>`,
              )
              .join("");

            const checkboxHtml = `<input type="checkbox" class="batch-check" style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer;" ${selectedSet.has(i) ? "checked" : ""} onclick="event.stopPropagation();toggleSelect(${i})" />`;
            const escapedName = (f.account || f.email || f.name || "").replace(
              /'/g,
              "\\'",
            );

            return `
      <div class="account-card ${selectedSet.has(i) ? "selected" : ""}" data-index="${i}" onclick="if(batchMode){toggleSelect(${i});}">
        ${checkboxHtml}
        <div class="account-icon">${icon}</div>
        <div class="account-info">
          <div class="account-email">${displayName}${tagStr}${getPriorityBadge(f.account)}</div>
          <div class="account-meta">
            <span>Provider: ${displayProvider}</span>
            <span>Type: ${displayType}</span>
            ${f.last_refresh ? `<span>刷新: ${new Date(f.last_refresh).toLocaleString()}</span>` : ""}
          </div>
          ${errorHtml}
        </div>
        <span class="status-badge ${badgeClass}">${badgeText}</span>
        <div class="account-actions">
          ${
            isEnabled
              ? `<button class="btn btn-danger" onclick="event.stopPropagation();if(confirm('确认禁用账号 ${escapedName}?')) toggleAccount(${i}, true)" title="禁用">⏸️</button>`
              : `<button class="btn btn-success" onclick="event.stopPropagation();if(confirm('确认启用账号 ${escapedName}?')) toggleAccount(${i}, false)" title="启用">▶️</button>`
          }
          ${
            isDisabled
              ? `<button class="btn btn-outline" onclick="event.stopPropagation();cycleAccountPriority('${escapeHtml(f.account)}')" title="切换优先级" style="padding:4px 8px;font-size:11px;">🏷️</button>`
              : ""
          }
          <button class="btn btn-outline" onclick="event.stopPropagation();deleteAccount(${i})" title="删除凭证" style="padding:4px 8px;font-size:11px;color:var(--red);">🗑️</button>
        </div>
      </div>
    `;
          })
          .join("");
      }

      // ============================================================
      // 操作
      // ============================================================

      // 仅刷新账号数据和 UI（不验证连接）
      async function refreshData() {
        try {
          const data = await apiRequest("GET", "/auth-files");
          const rawFiles = data?.files ?? (Array.isArray(data) ? data : []);
          allFiles = rawFiles.filter((f) => f.provider === "antigravity");
          renderStats(allFiles);
          renderFilterTabs(allFiles);
          renderAccounts(allFiles);
        } catch (err) {
          log(`刷新数据失败: ${err.message}`, "error");
        }
      }

      async function refresh() {
        showLoading(true);
        await refreshData();
        showLoading(false);
      }

      async function toggleAccount(index, disabled) {
        const f = allFiles[index];
        if (!f) return;
        const action = disabled ? "禁用" : "启用";
        log(`正在${action}: ${f.account}...`);
        try {
          await apiRequest("PATCH", "/auth-files/status", {
            name: f.name,
            disabled,
          });
          log(`已${action}: ${f.account}`, "success");
          await refresh();
        } catch (err) {
          log(`${action}失败: ${f.account} - ${err.message}`, "error");
        }
      }

      // 自动管理（调用后端执行）
      async function runAutoManage() {
        const btn = document.getElementById("btnAuto");
        btn.disabled = true;
        showLoading(true);
        try {
          await fetch(ENDPOINT_PATROL_RUN, {
            method: "POST",
            headers: authHeaders(),
          });
        } catch (err) {
          log(`自动管理触发失败: ${err.message}`, "error");
        }
        await restoreLogs();
        btn.disabled = false;
        await refresh();
        showLoading(false);
      }

      // 初始化应用（登录后调用）
      async function initApp() {
        initLayout();
        setConnection("ok", "已连接");
        await loadConfig();
        await Promise.all([restoreLogs(), loadPriorityFromServer()]);
        syncPatrolStatus();
        startLogPoll();
        refresh();
      }

      // 页面加载
      window.addEventListener("DOMContentLoaded", async () => {
        // 0. 恢复登录表单状态（同步）
        const savedCred = loadCredentials();
        if (savedCred) {
          if (savedCred.base)
            document.getElementById("loginBase").value = savedCred.base;
          document.getElementById("loginRemember").checked = true;
        }

        let loggedIn = false;

        // 1. 先检查 sessionStorage 中的 token（当前标签页内有效）
        if (await checkAuth()) {
          loggedIn = true;
        }
        // 2. 尝试从 localStorage 恢复保存的凭据（记住密码）
        else if (await restoreSession()) {
          loggedIn = true;
        }

        // 3. 移除启动遮罩，显示正确页面
        document.getElementById("bootOverlay").remove();
        if (loggedIn) {
          document.getElementById("btnLogout").style.display = "";
          initApp();
        } else {
          document.getElementById("loginOverlay").style.display = "flex";
        }
      });
    </script>
    <button
      class="fab"
      id="fabLog"
      onclick="toggleLogDrawer()"
      title="查看日志"
    >
      📜
    </button>
    <div
      class="drawer-overlay"
      id="drawerOverlay"
      onclick="toggleLogDrawer()"
    ></div>
  </body>
</html>
